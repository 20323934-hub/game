<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arcade Zone</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    h1 {
      margin-bottom: 20px;
      color: #38bdf8;
      text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }
    .card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      transition: transform 0.2s, border-color 0.2s;
    }
    .card:hover {
      transform: translateY(-5px);
      border-color: #38bdf8;
    }
    .card h2 {
      margin-bottom: 10px;
      color: #f1f5f9;
    }
    .card p {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 15px;
    }
    .play-btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 20px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }
    .play-btn:hover {
      background: #0369a1;
    }
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      justify-content: center;
      align-items: center;
      flex-direction: column;
      z-index: 100;
    }
    .modal-content {
      background: #0f172a;
      border: 2px solid #38bdf8;
      border-radius: 12px;
      width: 90%;
      max-width: 800px;
      height: 80vh;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
    }
    .close-btn {
      position: absolute;
      top: 10px;
      right: 15px;
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      z-index: 101;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      border-radius: 0 0 10px 10px;
    }
  </style>
</head>
<body>

  <h1>🎮 Arcade Zone</h1>

  <div class="grid">
    <div class="card">
      <h2>Slope</h2>
      <p>Drive the ball down the steep slopes and avoid obstacles.</p>
      <button class="play-btn" onclick="openGame('https://ubg77.github.io/edit/slope/')">Play Slope</button>
    </div>

    <div class="card">
      <h2>Gunblood</h2>
      <p>Test your reaction speed in western duels.</p>
      <button class="play-btn" onclick="openGame('https://efebal1.github.io/gunblood/')">Play Gunblood</button>
    </div>
  </div>

  <div id="gameModal" class="modal">
    <div class="modal-content">
      <button class="close-btn" onclick="closeGame()">Close ✖</button>
      <iframe id="gameFrame" src=""></iframe>
    </div>
  </div>

  <script>
    const modal = document.getElementById('gameModal');
    const frame = document.getElementById('gameFrame');

    function openGame(url) {
      frame.src = url;
      modal.style.display = 'flex';
    }

    function closeGame() {
      modal.style.display = 'none';
      frame.src = '';
    }
  </script>
</body>
</html>
